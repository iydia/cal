name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re

          pattern = r"(?:feat|docs|fix|ci|ui|vqa|refactor)\(.+\):[ \t]*\S.*"

          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              raise SystemExit(
                  "Expected: prefix(content): message. "
                  "Allowed prefixes: feat, docs, fix, ci, ui, vqa, refactor."
              )
          PY